# Hydra: no outputs/<date>/<time> run directory, .hydra/ subdir or log file.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false

# Reference model: prior, likelihood/loss and where the data and posterior samples come from.
data:
  base_prior:                     # reference prior
    _target_: src.common.distributions.gaussian.Gaussian
    mu: 2
    sigma: 4
  candidate_prior:                # exponential-family candidate family (parameter values are not used)
    _target_: src.common.distributions.gaussian.Gaussian
    mu: 0
    sigma: 1
  loss:                           # likelihood (variance known)
    _target_: src.common.losses.gaussian_log_likelihood.GaussianLogLikelihood
    mu: 0
    sigma: 2
  loss_lr: 1.0                    # current learning rate
  loss_lr_init: 1.0               # reference learning rate
  true_dgp:                       # used only to simulate data when observations_path is null
    _target_: src.common.distributions.gaussian.Gaussian
    mu: 3
    sigma: 2
  observations_num: 100
  observations_path: null         # .npy file with the data, relative to the launch directory
  posterior_samples_path: null    # .npy file with reference-posterior draws; null samples the conjugate posterior
  prior_samples_path: null        # .npy file with reference-prior draws; null samples base_prior
  posterior_samples_num: 1000
  prior_samples_num: 1000

model:
  _target_: src.common.bayesian_model.gaussian.SimpleGaussianModel

# Neighbourhood Gamma: one natural-parameter box per prior component, in posterior-column order.
sensitivity:
  natural_box:
    theta:
      eta_1: [-1.0, 1.0]          # mu / sigma^2
      eta_2: [-0.5, -0.02]        # -1 / (2 sigma^2), must stay < 0
  lr_interval: [0.5, 1.5]
