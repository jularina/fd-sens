# Hydra: no outputs/<date>/<time> run directory, .hydra/ subdir or log file.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

flags:
  plots:
    output_dir: outputs/presentation/slide_1

playground:
  output_prefix: slide_1
