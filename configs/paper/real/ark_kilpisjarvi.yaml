# Hydra: no outputs/<date>/<time> run directory, .hydra/ subdir or log file.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

data:
  base_prior:
    _target_: src.distributions.composite.CompositeProduct
    distributions:
      alpha:
        _target_: src.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta1:
        _target_: src.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta2:
        _target_: src.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta3:
        _target_: src.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta4:
        _target_: src.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta5:
        _target_: src.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      sigma:
        _target_: src.distributions.cauchy.HalfCauchy
        gamma: 1
  candidate_prior:
    _target_: src.distributions.composite.CompositeProduct
    distributions:
      alpha:
        _target_: src.distributions.gaussian.Gaussian
        mu: -2
        sigma: 1
      beta1:
        _target_: src.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      beta2:
        _target_: src.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      beta3:
        _target_: src.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      beta4:
        _target_: src.distributions.gaussian.Gaussian
        mu: -2
        sigma: 1
      beta5:
        _target_: src.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      sigma:
        _target_: src.distributions.inverse_gamma.InverseGamma
        alpha: 3.0
        beta: 1.0
  true_dgp: null
  loss:
    _target_: src.losses.gaussian_log_likelihood.GaussianARLogLikelihood
  loss_lr: 1
  observations_path: null
  posterior_samples_path: null
  prior_samples_path: null
  observations_num: null
  posterior_samples_num: null
  prior_samples_num: null
  warmup: 1000
  posterior_draws_path: "/Users/arinaodv/Desktop/folder/study_phd/code/posteriordb/posterior_database/reference_posteriors/draws/draws/kilpisjarvi-reference-draws.json"
  posterior_draws_corner_prior: "/Users/arinaodv/Desktop/folder/study_phd/code/posteriordb/posterior_database/reference_posteriors/draws/draws/kilpisjarvi-reference-draws-corner.json"

model:
  _target_: src.bayesian_model.posteriordb.kilpisjarvi.KilpisjarviBayesianModel

flags:
  plots:
    generate_plots:
      heatmap: false
      line_plot: false
      density_plot: true
    output_dir: outputs/paper/plots/fisher/kilpisjarvi

playground:
  output_prefix: kilpisjarvi_param
  # stage: all | optimise | plot_predictive (see run_kilpisjarvi_param_predictive.sh)
  stage: all
  # Shared z-space parametric box: mu_z in [-z_mu_max, z_mu_max], sigma_z in [z_sigma_min, z_sigma_max]
  z_mu_max: 1.0
  z_sigma_min: 0.5
  z_sigma_max: 2.0
  save_json: true
  save_csv: true
  n_timing_runs: 500
