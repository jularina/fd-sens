data:
  samples_path: /Users/arinaodv/Desktop/folder/study_phd/code/bnn_priors/results/exp_uci_boston/1/samples.pt
  param_groups:
    - net.module.0.weight_prior
    - net.module.0.bias_prior
    - net.module.2.weight_prior
    - net.module.2.bias_prior
    - net.module.4.weight_prior
    - net.module.4.bias_prior
  prior_samples_num: 2000
  seed: 0

model:
  _target_: src.bayesian_model.bnn.boston_bnn.BNNPosteriorSamples

optimize:
  nonparametric:
    # Matern basis with data-driven (halton) centres, same family as
    # configs/paper/toy/univariate_gaussian_nonparam.yaml, just K=10 instead
    # of 5. Unlike FixedCentersRBFBasisFunction, centres/lengthscale are
    # fit once per tensor from that tensor's own prior draws (not fixed at
    # loc +- k*scale), so this is NOT batchable across nodes in one call --
    # see SEPARABLE in src/optimization/bnn_node_sensitivity.py.
    basis_funcs_type: MaternBasisFunction
    basis_funcs_kwargs:
      num_basis_functions: 10
      method: halton
      nu: 2.0
      estimation_samples_source: prior

sensitivity:
  radius: 50.0  # global perturbation budget r; uniform allocation r_j = r / J
  node_chunk_size: 1024
  top_k: 20
  top_k_plot: 20  # number of most sensitive nodes to plot candidate priors for
  # The real per-node radius r_j = radius / J is tiny (uniform split over J~5000
  # nodes), so the worst-case candidate at r_j is visually indistinguishable
  # from the reference prior. `candidate_display_radius` is a separate, larger
  # radius used ONLY to make the candidate-prior plot legible; it does not
  # affect the reported sensitivity numbers (which always use r_j).
  candidate_display_radius: 5.0

flags:
  plots:
    output_dir: outputs/paper/plots/fisher/bnn/boston/nonparam
  results:
    output_dir: outputs/paper/results/bnn/boston/nonparam
