# Hydra: no outputs/<date>/<time> run directory, .hydra/ subdir or log file.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

data:
  base_prior:
    _target_: src.common.distributions.composite.CompositeProduct
    distributions:
      alpha:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta1:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta2:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta3:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta4:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      beta5:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 0
        sigma: 5
      sigma:
        _target_: src.common.distributions.cauchy.HalfCauchy
        gamma: 1
  candidate_prior:
    _target_: src.common.distributions.composite.CompositeProduct
    distributions:
      alpha:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: -2
        sigma: 1
      beta1:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      beta2:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      beta3:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      beta4:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: -2
        sigma: 1
      beta5:
        _target_: src.common.distributions.gaussian.Gaussian
        mu: 2
        sigma: 1
      sigma:
        _target_: src.common.distributions.inverse_gamma.InverseGamma
        alpha: 3.0
        beta: 1.0
  true_dgp: null
  loss:
    _target_: src.common.losses.gaussian_log_likelihood.GaussianARLogLikelihood
  loss_lr: 1
  warmup: 1000
  posterior_draws_path: "/Users/arinaodv/Desktop/folder/study_phd/code/posteriordb/posterior_database/reference_posteriors/draws/draws/kilpisjarvi-reference-draws.json"
  prior_samples_num: 10000
  center_prior_samples_num: 5000
  seed: 0

model:
  _target_: src.nonparametric.loaders.KilpisjarviNonparametricLoader

optimize:
  nonparametric:
    # Every component is first mapped to z = Phi^{-1}(F_ref(theta)) (see
    # run_parametric.py's _to_z_space), so all 7 reference-
    # prior marginals become exactly N(0, 1) regardless of the original
    # family (Gaussian alpha/beta1..5, Half-Cauchy sigma). The same kernel
    # family, number of centres, centre-selection procedure and lengthscale-
    # selection rule below therefore apply identically and fairly to every
    # component -- no per-group override needed.
    basis_funcs_type: MaternBasisFunction
    basis_funcs_kwargs:
      num_basis_functions: 300
      method: random
      nu: 3.5
      estimation_samples_source: prior

flags:
  plots:
    output_dir: outputs/paper/plots/fisher/kilpisjarvi/param_vs_nonparam
