# Hydra: no outputs/<date>/<time> run directory, .hydra/ subdir or log file.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

data:
  dataset: energy
  samples_path: /Users/arinaodv/Desktop/folder/study_phd/code/bnn_priors/results/exp_uci_energy_gaussian_heinit/1_20260909/samples.pt
  param_groups:
    - net.module.0.weight_prior
    - net.module.0.bias_prior
    - net.module.2.weight_prior
    - net.module.2.bias_prior
    - net.module.4.weight_prior
    - net.module.4.bias_prior
  prior_samples_num: 10000
  center_prior_samples_num: 5000
  seed: 0
  reference_prior: gaussian
  feature_names:
    - X1
    - X2
    - X3
    - X4
    - X5
    - X6
    - X7
    - X8

model:
  _target_: src.bayesian_model.bnn.uci_bnn.BNNPosteriorSamples

optimize:
  nonparametric:
    basis_funcs_type: MaternBasisFunction
    basis_funcs_kwargs:
      num_basis_functions: 100
      method: random
      nu: 3.5
      estimation_samples_source: prior

sensitivity:
  r_j: 5.0

flags:
  plots:
    output_dir: outputs/paper/plots/fisher/bnn/energy/nonparam/exp_uci_energy_gaussian
