data:
  dataset: boston
  samples_path: /Users/arinaodv/Desktop/folder/study_phd/code/bnn_priors/results/exp_uci_boston_gaussian_heinit/1_20260909/samples.pt
  param_groups:
    - net.module.0.weight_prior
    - net.module.0.bias_prior
    - net.module.2.weight_prior
    - net.module.2.bias_prior
    - net.module.4.weight_prior
    - net.module.4.bias_prior
  prior_samples_num: 10000
  center_prior_samples_num: 5000
  seed: 0
  reference_prior: gaussian
  feature_names:
    - CRIM
    - ZN
    - INDUS
    - CHAS
    - NOX
    - RM
    - AGE
    - DIS
    - RAD
    - TAX
    - PTRATIO
    - B
    - LSTAT

model:
  _target_: src.bayesian_model.bnn.uci_bnn.BNNPosteriorSamples

# Not used for the paper's real results (those use MaternBasisFunction, see
# bnn_boston_nonparam_gaussian.yaml) -- this config exists only to benchmark
# per-node-loop vs. batched-large-matrix runtime (see
# run_bnn_uci_sensitivity_batching_runtime_benchmark in
# tests/bnn/run_bnn_uci_fisher_nonparam.py), which needs a SEPARABLE basis
# (FixedCentersRBFBasisFunction treats every node independently -- see its
# docstring) to make the batched code path valid at all.
optimize:
  nonparametric:
    basis_funcs_type: FixedCentersRBFBasisFunction
    basis_funcs_kwargs:
      center_multiples: [
        -3, -2.87755, -2.7551, -2.63265, -2.5102, -2.38776, -2.26531, -2.14286, -2.02041, -1.89796,
        -1.77551, -1.65306, -1.53061, -1.40816, -1.28571, -1.16327, -1.04082, -0.918367, -0.795918, -0.673469,
        -0.55102, -0.428571, -0.306122, -0.183673, -0.0612245, 0.0612245, 0.183673, 0.306122, 0.428571, 0.55102,
        0.673469, 0.795918, 0.918367, 1.04082, 1.16327, 1.28571, 1.40816, 1.53061, 1.65306, 1.77551,
        1.89796, 2.02041, 2.14286, 2.26531, 2.38776, 2.5102, 2.63265, 2.7551, 2.87755, 3,
      ]

sensitivity:
  r_j: 5.0
  node_chunk_size: 1024
  top_k: 20
  top_k_plot: 20
  candidate_display_radius: 5.0

flags:
  plots:
    output_dir: outputs/paper/plots/fisher/bnn/boston/nonparam/exp_uci_boston_gaussian_rbf_benchmark
  results:
    output_dir: outputs/paper/results/bnn/boston/nonparam/exp_uci_boston_gaussian_rbf_benchmark
