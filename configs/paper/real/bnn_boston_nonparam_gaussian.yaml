data:
  dataset: boston
  samples_path: /Users/arinaodv/Desktop/folder/study_phd/code/bnn_priors/results/exp_uci_boston_gaussian_heinit/1_20260909/samples.pt
  param_groups:
    - net.module.0.weight_prior
    - net.module.0.bias_prior
    - net.module.2.weight_prior
    - net.module.2.bias_prior
    - net.module.4.weight_prior
    - net.module.4.bias_prior
  prior_samples_num: 10000
  center_prior_samples_num: 5000
  seed: 0
  reference_prior: gaussian
  feature_names:
    - CRIM
    - ZN
    - INDUS
    - CHAS
    - NOX
    - RM
    - AGE
    - DIS
    - RAD
    - TAX
    - PTRATIO
    - B
    - LSTAT

model:
  _target_: src.bayesian_model.bnn.uci_bnn.BNNPosteriorSamples

optimize:
  nonparametric:
    basis_funcs_type: MaternBasisFunction
    basis_funcs_kwargs:
      num_basis_functions: 100
      method: random
      nu: 3.5
      estimation_samples_source: prior

sensitivity:
  r_j: 5.0
  node_chunk_size: 1024
  top_k: 20
  top_k_plot: 20
  candidate_display_radius: 5.0

flags:
  plots:
    output_dir: outputs/paper/plots/fisher/bnn/boston/nonparam/exp_uci_boston_gaussian
  results:
    output_dir: outputs/paper/results/bnn/boston/nonparam/exp_uci_boston_gaussian
