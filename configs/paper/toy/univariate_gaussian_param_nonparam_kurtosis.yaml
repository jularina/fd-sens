data:
  base_prior:
    _target_: src.distributions.gaussian.Gaussian
    mu: 0
    sigma: 2
  candidate_prior:
    _target_: src.distributions.gaussian.Gaussian
    mu: 0
    sigma: 2
  true_dgp:
    _target_: src.distributions.gaussian.Gaussian
    mu: 3
    sigma: 5
  loss:
    _target_: src.losses.gaussian_log_likelihood.GaussianLogLikelihood
    mu: 3
    sigma: 5
  loss_lr: 1.0
  loss_lr_init: 1.0
  observations_num: 20
  observations_path: null
  posterior_samples_path: null
  # Quasi-uniform samples over [-8, 10] rather than iid draws from the
  # reference prior: this both seeds the nonparametric basis centres over
  # the wide tail-covering interval described in the experiment and, used
  # unweighted in the prior-only FD Monte Carlo estimate, realises the
  # "no additional weighting" tail-tolerant FD constraint (a draw from the
  # reference N(0, 2) would essentially never land near +-8/10, so its
  # extreme quantiles cannot seed centres that far out).
  prior_samples_path: data/univariate_gaussian/prior_samples_kurtosis.npy
  posterior_samples_num: 1000
  prior_samples_num: 2000

model:
  _target_: src.bayesian_model.gaussian.SimpleGaussianModel

fd:
  optimize:
    prior:
      Gaussian:
        parameters_box_range:
          ranges:
            mu: [-4, 4]
            sigma: [1, 4]
          nums:
            mu: 17
            sigma: 7
    loss:
      GaussianLogLikelihood:
        parameters_box_range:
          ranges:
            lr: [0.5, 2.5]
          nums:
            lr: 9

# Weak-data location experiment illustrating sensitivity to tail behaviour:
# the Gaussian parametric neighbourhood can only shift/rescale the prior
# (zero excess kurtosis by construction), while the KEF nonparametric prior,
# with basis centres spread over the wide [-8, 10] interval and an
# unweighted (tail-tolerant) FD constraint, is free to develop heavier
# tails and positive excess kurtosis.
optimize:
  nonparametric:
    basis_funcs_type: MaternBasisFunction
    basis_funcs_kwargs: {"num_basis_functions": 15, "method": "halton", "nu": 1.5, "lengthscale": 2.0}
    radius: 40.0

flags:
  plots:
    output_dir: outputs/paper/plots/fisher/univariate/param_nonparam_kurtosis
